name: CI

on:
  push:
  pull_request:

jobs:
  ai:
    name: ai (ruff + pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ai/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../ml
      - run: pytest -q
      - name: ml scripts tests
        run: pytest -q ../ml/tests

  api:
    name: api (eslint + vitest + tsc)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: frontend (eslint + build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build

  docker:
    name: docker build (${{ matrix.service }})
    needs: [ai, api, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai, api, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: mockai-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  k8s:
    name: kubernetes manifests (kubeconform + kind dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render with kustomize
        run: kubectl kustomize infra/k8s > rendered.yaml
      - name: schema validation (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary rendered.yaml infra/k8s/secret.example.yaml
      - uses: helm/kind-action@v1
        with: { cluster_name: ci }
      - name: server-side dry run against a real API server
        run: |
          kubectl apply -f infra/k8s/base.yaml
          kubectl apply -f infra/k8s/secret.example.yaml
          kubectl apply --dry-run=server -k infra/k8s
