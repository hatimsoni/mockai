# The three application services. Images are built locally and loaded into kind
# (`kind load docker-image ...`), hence imagePullPolicy: IfNotPresent and the :local tag.

# ---------- ai (FastAPI) ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-data
  namespace: mockai
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 3Gi } } # Chroma vectors + Whisper weights cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: mockai
spec:
  # 1 replica because Chroma lives on a ReadWriteOnce disk. To scale out, move vectors to a
  # Chroma server (or pgvector) and raise replicas — the service itself is stateless.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: ai }
  template:
    metadata:
      labels: { app: ai }
    spec:
      containers:
        - name: ai
          image: mockai-ai:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: mockai-config }
          env:
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: mockai-secrets, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: mockai-secrets, key: S3_SECRET_KEY } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: mockai-secrets, key: INTERNAL_API_KEY } }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: mockai-secrets, key: LLM_API_KEY } }
          readinessProbe: # receive traffic only when ready
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe: # restart if it hangs
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 500m, memory: 1500Mi } # Whisper small + MiniLM + torch
            limits: { memory: 3Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ai-data }
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: mockai
spec:
  selector: { app: ai }
  ports: [{ port: 8000 }]
---
# ---------- api (Express) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mockai
spec:
  replicas: 2 # stateless (JWT + Postgres) -> safe to run several
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: mockai-api:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: mockai-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: mockai-secrets, key: DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: mockai-secrets, key: JWT_SECRET } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: mockai-secrets, key: INTERNAL_API_KEY } }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mockai
spec:
  selector: { app: api }
  ports: [{ port: 4000 }]
---
# ---------- frontend (Next.js) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mockai
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: mockai-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - name: API_URL
              valueFrom: { configMapKeyRef: { name: mockai-config, key: API_URL } }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
---
# NodePort 30000 is mapped to localhost:3000 by kind-config.yaml.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mockai
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30000 }]
