# Namespace + non-secret configuration shared by all services.
apiVersion: v1
kind: Namespace
metadata:
  name: mockai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mockai-config
  namespace: mockai
data:
  # service discovery: Kubernetes DNS name = <service>.<namespace>.svc
  AI_SERVICE_URL: http://ai:8000
  API_URL: http://api:4000
  LLM_BASE_URL: http://ollama:11434/v1
  LLM_MODEL: qwen2.5:7b-instruct
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: mockai
  CHROMA_DIR: /data/chroma
  HF_HOME: /models-cache
  CORS_ORIGIN: http://localhost:3000
  DEFAULT_QUESTION_COUNT: "5"
